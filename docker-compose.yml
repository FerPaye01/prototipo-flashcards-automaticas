version: '3.8'

services:
  db:
    image: pgvector/pgvector:16-pg16
    container_name: flashcards_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-flashcards}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - flashcards_net

  localstack:
    image: localstack/localstack:latest
    container_name: flashcards_localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # external services port range
    environment:
      - SERVICES=s3
      - DEBUG=${DEBUG:-0}
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./localstack_data}:/var/run/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - flashcards_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: flashcards_api
    depends_on:
      - db
      - localstack
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-flashcards}
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - GEMINI_API_KEYS_OCR=${GEMINI_API_KEYS_OCR}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3}
      - GEMINI_API_KEY_4=${GEMINI_API_KEY_4}
      - API_KEY_SECRET=${API_KEY_SECRET:-supersecretkey}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - flashcards_net

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: flashcards_ui
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
      - API_KEY_SECRET=${API_KEY_SECRET:-supersecretkey}
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    networks:
      - flashcards_net

networks:
  flashcards_net:
    driver: bridge

volumes:
  postgres_data:
  localstack_data:
